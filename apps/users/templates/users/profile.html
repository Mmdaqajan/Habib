{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div style="text-align:center; margin-bottom:24px;">
        <div style="width:100px; height:100px; margin:0 auto 12px; border-radius:50%; background:rgba(15, 23, 42, 0.9); display:flex; align-items:center; justify-content:center; font-size:2.8rem; color:var(--accent-green); border:3px solid var(--accent-green); box-shadow:0 0 20px var(--glow-green); overflow:hidden;">
            {% if profile.profile_pic %}
                <img src="{{ profile.profile_pic.url }}" alt="تصویر پروفایل" style="width:100%; height:100%; object-fit:cover;">
            {% else %}
                <i class="fa-solid fa-user-astronaut"></i>
            {% endif %}
        </div>
        <h3 style="color:var(--text-bright); font-weight:800;">{{ profile.name }}</h3>
        <span style="font-size:0.85rem; color:var(--text-muted);">{{ profile.email }}</span>
    </div>

    <form action="{% url 'profile' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="profile-name">نام و نام خانوادگی</label>
            <input id="profile-name" type="text" name="name" class="form-control" value="{{ profile.name }}">
        </div>
        <div class="form-group">
            <label for="profile-age">سن</label>
            <input id="profile-age" type="number" name="age" class="form-control" value="{{ profile.age }}">
        </div>
        <div class="form-group">
            <label for="profile-email">ایمیل</label>
            <input id="profile-email" type="email" name="email" class="form-control" value="{{ profile.email }}">
        </div>
        <div class="form-group">
            <label for="profile-phone">شماره تلفن</label>
            <input id="profile-phone" type="text" name="phone" class="form-control" value="{{ profile.phone }}">
        </div>
        <div class="form-group">
            <label for="profile-pic">تصویر پروفایل</label>
            <input id="profile-pic" type="file" name="profile_pic" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:15px;">ذخیره تغییرات</button>
    </form>
</div>
{% endblock %}
