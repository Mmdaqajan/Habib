<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habib | حبیب</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(20, 26, 38, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #94a3b8;
            --text-bright: #f8fafc;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-lime: #34d399;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-orange: #f97316;
            --accent-purple: #a855f7;
            --glow-green: rgba(16, 185, 129, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.06) 0px, transparent 50%);
            color: var(--text-main);
            padding-bottom: 90px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            position: sticky; top: 0; z-index: 100;
        }

        .header-title {
            display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem; color: var(--text-bright);
        }
        .header-title i { color: var(--accent-green); filter: drop-shadow(0 0 8px var(--glow-green)); }

        .container { padding: 16px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px); border-top: 1px solid var(--card-border);
            display: flex; justify-content: space-around;
            padding: 12px 0; z-index: 1000;
        }

        .nav-item {
            color: var(--text-muted); text-decoration: none; display: flex; flex-direction: column;
            align-items: center; font-size: 0.75rem; gap: 5px; transition: all 0.3s; position: relative; font-weight: 600;
        }
        .nav-item i { font-size: 1.35rem; }
        .nav-item.active { color: var(--accent-green); transform: translateY(-2px); }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -6px; width: 16px; height: 3px;
            background: var(--accent-green); border-radius: 4px; box-shadow: 0 0 8px var(--accent-green);
        }

        .card {
            background: var(--card-bg); backdrop-filter: blur(8px);
            border: 1px solid var(--card-border); border-radius: 16px;
            padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 15, 0.85); backdrop-filter: blur(10px); z-index: 2000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #111827; border: 1px solid var(--card-border); border-radius: 20px;
            width: 100%; max-width: 420px; padding: 24px; color: var(--text-main);
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 600; }
        .form-control {
            width: 100%; padding: 12px 14px; background: #0b0f17; border: 1px solid var(--card-border);
            border-radius: 10px; color: var(--text-bright); font-size: 0.95rem; outline: none;
        }
        .btn {
            display: inline-block; padding: 12px 18px; border-radius: 12px; border: none;
            font-weight: 700; cursor: pointer; text-align: center; width: 100%; font-size: 0.95rem; transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; box-shadow: 0 4px 14px var(--glow-green); }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-secondary { background: #1f2937; color: var(--text-main); border: 1px solid var(--card-border); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="header-title">
            <i class="fa-solid fa-gem"></i>
            <span>Habib | حبیب</span>
        </div>
        <div style="font-size: 0.75rem; color: var(--accent-green); background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 20px; font-weight:700;">نسخه ماژولار v2.0</div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <nav class="bottom-nav">
        <a href="{% url 'home' %}" class="nav-item {% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'overview' %}active{% endif %}">
            <i class="fa-solid fa-house"></i>
            <span>عادت‌ها</span>
        </a>
        <a href="{% url 'alerts' %}" class="nav-item {% if request.resolver_match.url_name == 'alerts' %}active{% endif %}">
            <i class="fa-solid fa-bell"></i>
            <span>یادآوری‌ها</span>
        </a>
        <a href="{% url 'profile' %}" class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <i class="fa-solid fa-user"></i>
            <span>تنظیمات</span>
        </a>
    </nav>
    {% block extra_script %}{% endblock %}
</body>
</html>
